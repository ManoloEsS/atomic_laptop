# Fedora Laptop: disable WiFi power save for stable interactive latency.
#
# Power save parks the radio between packets, adding wake-up latency spikes
# (observed 2ms -> 500ms+ on SSH over WiFi). Negligible battery cost on a
# dev laptop. This intentionally overrides the Fedora default; power profiles
# (Noctalia/tuned) do not manage WiFi link power, so this file is required.
# Managed by scripts/configure-system.sh; local edits will conflict.
[connection]
wifi.powersave = 2
