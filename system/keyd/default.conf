# System-wide remap, applied to EVERY keyboard via [ids] * (including external).
# Semantics: Caps=Esc tap / Ctrl hold; Esc=Caps; LeftAlt<->LeftMeta swap;
# held Left Control emits a Shift+Meta layer, NOT Control.
# To exclude a device, replace * with explicit IDs from `keyd monitor`
# (printed as lines like 0001:0002:abcdef) and list only the target keyboards.
[ids]

*

[shiftmeta:S-M]

[main]

leftcontrol = layer(shiftmeta)
# Maps capslock to escape when pressed and control when held.
capslock = overload(control, esc)

# Remaps the escape key to capslock
esc = capslock
leftalt = leftmeta
leftmeta = leftalt
