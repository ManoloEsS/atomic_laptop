add_newline = true
command_timeout = 200
format = "[$container$directory$git_branch$git_status]($style)$character"

[container]
format = "[$symbol\\[$name\\]]($style) "
symbol = "⬢ "
style = "bold yellow"

[character]
error_symbol = "[✗](bold #bb9af7)"
success_symbol = "[❯](bold #bb9af7)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold #bb9af7"
repo_root_style = "bold #bb9af7"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic #bb9af7"

[git_status]
format = '[$all_status]($style)'
style = "#bb9af7"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""
