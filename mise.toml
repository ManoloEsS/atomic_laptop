# fedora_laptop: rolling user-local tools and dotfiles.
# Install Mise to ~/.local/bin, then: mise install && mise upgrade
min_version = { hard = "2026.9.4" }

[tools]
"aqua:herdrdev/herdr" = "latest"
yazi = "latest"
tmux = "latest"
fzf = "latest"
bat = "latest"
eza = "latest"
zoxide = "latest"
gh = "latest"
jj = "latest"
opencode = "latest"
neovim = "latest"
ripgrep = "latest"
tree-sitter = "latest"
starship = "latest"
# Node provides npm for Mason's npm-based packages (prettier,
# markdownlint-cli2) after the old system nodejs layer is gone.
node = "latest"
# Binaries the Neovim config shells out to but nothing installs:
# lazygit (<leader>gg) and prettierd (conform for JS/TS).
lazygit = "latest"
"npm:@fsouza/prettierd" = "latest"
# Snacks explorer searching and Telescope require fd (rg/find fallbacks
# do not cover the explorer source).
fd = "latest"
# Go stays global (used across shells and tooling); other language
# runtimes belong in each project's Mise configuration.
go = "latest"

[bootstrap.repos]
"~/.local/share/fedora-laptop/sources/nvim" = { url = "https://github.com/ManoloEsS/kickstart.nvim.git", ref = "master" }

[dotfiles]
"~/.bash_aliases" = { source = "dotfiles/bash/.bash_aliases", mode = "symlink" }
"~/.bash_functions" = { source = "dotfiles/bash/.bash_functions", mode = "symlink" }
"~/.bash_profile" = { source = "dotfiles/bash/.bash_profile", mode = "symlink" }
"~/.bashrc" = { source = "dotfiles/bash/.bashrc", mode = "symlink" }
"~/.inputrc" = { source = "dotfiles/bash/.inputrc", mode = "symlink" }
"~/.config/fedora-laptop" = { source = "dotfiles/bash/.config/fedora-laptop", mode = "symlink-each" }
"~/.config/ghostty" = { source = "dotfiles/ghostty/.config/ghostty", mode = "symlink-each" }
"~/.config/herdr" = { source = "dotfiles/herdr/.config/herdr", mode = "symlink-each" }
"~/.config/niri" = { source = "dotfiles/niri/.config/niri", mode = "symlink-each" }
"~/.config/noctalia" = { source = "dotfiles/noctalia/.config/noctalia", mode = "symlink-each" }
"~/.config/tmux" = { source = "dotfiles/tmux/.config/tmux", mode = "symlink-each" }
"~/.config/yazi" = { source = "dotfiles/yazi/.config/yazi", mode = "symlink-each" }
"~/.local/bin" = { source = "dotfiles/local-bin/.local/bin", mode = "symlink-each" }
"~/.config/systemd/user" = { source = "dotfiles/systemd/.config/systemd/user", mode = "symlink-each" }
"~/.config/starship.toml" = { source = "dotfiles/starship/.config/starship.toml", mode = "symlink" }
"~/.config/nvim" = { source = "~/.local/share/fedora-laptop/sources/nvim", mode = "symlink" }
